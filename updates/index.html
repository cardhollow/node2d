<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Node2D Updates</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#202020;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.updates-app{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;height:100%}.updates-top{padding:10px;border-bottom:1px solid #3d3d3d;background:#292929}.updates-search{width:100%;height:38px;padding:0 11px;background:#202020;border:1px solid #4b4b4b;border-radius:6px;color:#ddd;outline:none}.updates-search:focus{border-color:#777}.updates-body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}.updates-nav{min-height:0;overflow:auto;border-right:1px solid #3d3d3d;padding:8px;background:#252525;-webkit-overflow-scrolling:touch}.updates-section{margin-bottom:7px}.updates-title{width:100%;display:flex;align-items:center;gap:7px;height:32px;padding:0 8px;background:none;border:0;border-radius:5px;color:#bbb;text-align:left;font-weight:600;cursor:pointer}.updates-title:hover{background:#333;color:#eee}.updates-title .arrow{width:12px;color:#888}.updates-items{padding-left:18px}.updates-items.hidden{display:none}.updates-subtitle{width:100%;display:block;padding:6px 8px;background:none;border:0;border-radius:4px;color:#999;text-align:left;cursor:pointer}.updates-subtitle:hover{background:#343434;color:#eee}.updates-subtitle.active{background:#3a382d;color:#e4ca4e}.updates-main{min-width:0;min-height:0;overflow:auto;padding:22px 24px;-webkit-overflow-scrolling:touch}.updates-content{max-width:900px;line-height:1.55}.updates-content h1,.updates-content h2,.updates-content h3{color:#eee;margin:0 0 12px}.updates-content p{color:#bbb}.updates-content code{background:#171717;border:1px solid #3d3d3d;border-radius:4px;padding:1px 4px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.updates-content ul{padding-left:20px}.updates-empty{padding:20px 10px;color:#777;font-size:12px}@media(max-width:760px){.updates-body{grid-template-columns:205px minmax(0,1fr)}.updates-main{padding:15px}.updates-nav{padding:6px}}
</style>
</head>
<body>
<div class="updates-app">
  <div class="updates-top"><input id="updatesSearch" class="updates-search" type="search" placeholder="Search updates…" autocomplete="off" spellcheck="false"></div>
  <div class="updates-body"><nav id="updatesNav" class="updates-nav"></nav><main id="updatesMain" class="updates-main"><article id="updatesContent" class="updates-content"></article></main></div>
</div>
<script>
(()=>{
  let sections=[];let filtered=[];let selected=null;let openState=Object.create(null);
  const nav=document.getElementById('updatesNav'),main=document.getElementById('updatesContent'),search=document.getElementById('updatesSearch');
  const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const strip=s=>String(s??'').replace(/<[^>]*>/g,' ');
  const slug=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'update';
  function normalize(data){
    return Array.isArray(data)?data.map((s,i)=>({title:String(s.title||`Version ${i+1}`),items:Array.isArray(s.items)?s.items.map((x,ii)=>({id:String(x.id||`${slug(s.title)}--${slug(x.subtitle||`change-${ii}`)}`),subtitle:String(x.subtitle||''),contents:String(x.contents||'')})):[]})):[];
  }
  function matches(section,item,terms){const hay=(section.title+' '+item.subtitle+' '+strip(item.contents)).toLowerCase();return terms.every(t=>hay.includes(t));}
  function render(){
    const terms=search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    filtered=[];sections.forEach((section,si)=>section.items.forEach((item,ii)=>{if(!terms.length||matches(section,item,terms))filtered.push({si,ii});}));
    if(filtered.length&&!selected)selected=filtered[0];
    if(selected&&!filtered.some(x=>x.si===selected.si&&x.ii===selected.ii))selected=filtered[0]||null;
    nav.innerHTML='';
    sections.forEach((section,si)=>{
      const hits=filtered.some(x=>x.si===si);if(terms.length&&!hits)return;
      const wrap=document.createElement('section');wrap.className='updates-section';
      const title=document.createElement('button');title.className='updates-title';title.type='button';
      const collapsed=!!openState[si];title.innerHTML=`<span class="arrow">${collapsed?'+':'−'}</span><span>${esc(section.title)}</span>`;
      const items=document.createElement('div');items.className='updates-items'+(collapsed?' hidden':'');
      section.items.forEach((item,ii)=>{if(terms.length&&!matches(section,item,terms))return;const b=document.createElement('button');b.className='updates-subtitle'+(selected?.si===si&&selected?.ii===ii?' active':'');b.type='button';b.textContent=item.subtitle;b.onclick=()=>{selected={si,ii};render();showSelected();};items.append(b);});
      title.onclick=()=>{openState[si]=!openState[si];render();};wrap.append(title,items);nav.append(wrap);
    });
    showSelected();
  }
  function showSelected(){if(!selected){main.innerHTML='<div class="updates-empty">No updates match this search.</div>';return;}const section=sections[selected.si],item=section?.items?.[selected.ii];main.innerHTML=item?item.contents:'<div class="updates-empty">Select an update from the navigation.</div>';}
  search.addEventListener('input',render);
  fetch('changes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{sections=normalize(data);render();}).catch(e=>{main.innerHTML=`<div class="updates-empty">Could not load changes.json: ${esc(e.message)}</div>`;});
})();
</script>
</body>
</html>
