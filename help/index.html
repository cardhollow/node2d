<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Node2D Help</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#202020;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.help-app{display:grid;grid-template-rows:auto minmax(0,1fr);width:100%;height:100%}.help-top{padding:10px;border-bottom:1px solid #3d3d3d;background:#292929}.help-search{width:100%;height:38px;padding:0 11px;background:#202020;border:1px solid #4b4b4b;border-radius:6px;color:#ddd;outline:none}.help-search:focus{border-color:#777}.help-body{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0}.help-nav{min-height:0;overflow:auto;border-right:1px solid #3d3d3d;padding:8px;background:#252525;-webkit-overflow-scrolling:touch}.help-section{margin-bottom:7px}.help-title{width:100%;display:flex;align-items:center;gap:7px;height:32px;padding:0 8px;background:none;border:0;border-radius:5px;color:#bbb;text-align:left;font-weight:600;cursor:pointer}.help-title:hover{background:#333;color:#eee}.help-title .arrow{width:12px;color:#888}.help-items{padding-left:18px}.help-items.hidden{display:none}.help-subtitle{width:100%;display:block;padding:6px 8px;background:none;border:0;border-radius:4px;color:#999;text-align:left;cursor:pointer}.help-subtitle:hover{background:#343434;color:#eee}.help-subtitle.active{background:#3a382d;color:#e4ca4e}.help-section.hidden-section .help-items{display:none}.help-empty{padding:20px 10px;color:#777;font-size:12px}.help-main{min-width:0;min-height:0;overflow:auto;padding:22px 24px;-webkit-overflow-scrolling:touch}.help-content{max-width:900px;line-height:1.55}.help-content h1,.help-content h2,.help-content h3{color:#eee;margin:0 0 12px}.help-content p{color:#bbb}.help-content code{background:#171717;border:1px solid #3d3d3d;border-radius:4px;padding:1px 4px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.help-content pre{overflow:auto;background:#171717;border:1px solid #3d3d3d;border-radius:6px;padding:10px}.help-content table{border-collapse:collapse;width:100%}.help-content th,.help-content td{border:1px solid #444;padding:7px;text-align:left}.help-content a.help-ref{color:#e4ca4e;text-decoration:underline;text-underline-offset:2px}.help-content a.help-ref:hover{color:#f0d966}.help-status{color:#777;font-size:11px;margin-top:8px}.help-match{outline:1px solid #555}@media(max-width:760px){.help-body{grid-template-columns:205px minmax(0,1fr)}.help-main{padding:15px}.help-nav{padding:6px}}
</style>
<script>window.UIX_EDITOR_CONTEXT=false;</script>
<script src="../js/keyBinds.js"></script>
</head>
<body>
<div class="help-app">
  <div class="help-top"><input id="helpSearch" class="help-search" type="search" placeholder="Search help…" autocomplete="off" spellcheck="false"></div>
  <div class="help-body"><nav id="helpNav" class="help-nav"></nav><main id="helpMain" class="help-main"><article id="helpContent" class="help-content"></article></main></div>
</div>
<script>
(()=>{
  let sections=[];let filtered=[];let selected=null;let openState=Object.create(null);
  const nav=document.getElementById('helpNav'),main=document.getElementById('helpContent'),search=document.getElementById('helpSearch');
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const strip=s=>String(s??'').replace(/<[^>]*>/g,' ');
  function keybindSection(){
    const defs=window.UIXKeyBinds?.getAll?.()||[];
    const rows=defs.map(d=>`<tr><td>${esc(d.name)}</td><td><code>${esc(window.UIXKeyBinds?.display?.(d.keys)||d.keys||'')}</code></td><td>${esc(d.scope)}</td></tr>`).join('');
    return {title:'Keyboard Shortcuts',items:[{subtitle:'All Shortcuts',contents:`<h2>Keyboard Shortcuts</h2><p>These are loaded directly from <code>js/keyBinds.js</code>, so this Help page uses the same command definitions as the editor.</p><table><thead><tr><th>Command</th><th>Shortcut</th><th>Scope</th></tr></thead><tbody>${rows}</tbody></table>`}]};
  }
  const topicSlug=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'topic';
  function normalize(data){return Array.isArray(data)?data.map((s,i)=>({title:String(s.title||`Section ${i+1}`),items:Array.isArray(s.items)?s.items.map((x,ii)=>({id:String(x.id||`${topicSlug(s.title)}--${topicSlug(x.subtitle||`topic-${ii}`)}`),subtitle:String(x.subtitle||''),contents:String(x.contents||'')})):[]})):[];}
  function matches(item,terms){const hay=(item.title+' '+item.subtitle+' '+strip(item.contents)).toLowerCase();return terms.every(t=>hay.includes(t));}
  function render(){
    const terms=search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    filtered=[];sections.forEach((section,si)=>{section.items.forEach((item,ii)=>{if(!terms.length||matches({title:section.title,subtitle:item.subtitle,contents:item.contents},terms))filtered.push({si,ii,section,item});});});
    const first=filtered[0]; if(first && (!selected || !filtered.some(x=>x.si===selected.si&&x.ii===selected.ii))) selected={si:first.si,ii:first.ii};
    if(!first) selected=null;
    nav.innerHTML='';
    sections.forEach((section,si)=>{
      const hits=filtered.some(x=>x.si===si); if(terms.length&&!hits)return;
      const wrap=document.createElement('section');wrap.className='help-section';
      const title=document.createElement('button');title.className='help-title';title.type='button';
      const collapsed=!!openState[si]; title.innerHTML=`<span class="arrow">${collapsed?'+':'−'}</span><span>${esc(section.title)}</span>`;
      const items=document.createElement('div');items.className='help-items'+(collapsed?' hidden':'');
      section.items.forEach((item,ii)=>{
        if(terms.length&&!matches({title:section.title,subtitle:item.subtitle,contents:item.contents},terms))return;
        const b=document.createElement('button');b.className='help-subtitle'+(selected?.si===si&&selected?.ii===ii?' active':'');b.type='button';b.textContent=item.subtitle;b.addEventListener('click',()=>{selected={si,ii};render();showSelected();});items.append(b);
      });
      title.addEventListener('click',()=>{openState[si]=!openState[si];render();});
      wrap.append(title,items);nav.append(wrap);
    });
    showSelected();
    const q=new URL(location.href);if(search.value.trim())q.searchParams.set('search',search.value.trim());else q.searchParams.delete('search');if(selected){const current=sections[selected.si]?.items?.[selected.ii];if(current)q.searchParams.set('topic',current.id);}else q.searchParams.delete('topic');history.replaceState(null,'',q);
  }
  function showSelected(){
    if(!selected){main.innerHTML='<div class="help-empty">No help result matches this search.</div>';return;}
    const section=sections[selected.si],item=section?.items?.[selected.ii];
    main.innerHTML=item?item.contents:'<div class="help-empty">Select a topic from the navigation.</div>';
  }
  function selectTopic(topic){
    const wanted=String(topic||'').trim();
    if(!wanted)return false;
    for(let si=0;si<sections.length;si++){
      const ii=sections[si].items.findIndex(item=>item.id===wanted);
      if(ii>=0){selected={si,ii};openState[si]=false;return true;}
    }
    const lower=wanted.toLowerCase();
    for(let si=0;si<sections.length;si++){
      const ii=sections[si].items.findIndex(item=>item.id.toLowerCase()===lower);
      if(ii>=0){selected={si,ii};openState[si]=false;return true;}
    }
    return false;
  }
  main.addEventListener('click',e=>{
    const link=e.target.closest('a.help-ref');
    if(!link)return;
    const raw=link.dataset.helpTopic||link.getAttribute('href')||'';
    const topic=raw.startsWith('#help:')?raw.slice(6):raw;
    if(!topic)return;
    e.preventDefault();
    if(!selectTopic(topic))return;
    const url=new URL(location.href);url.searchParams.set('topic',topic);history.replaceState(null,'',url);
    render();
    main.scrollTop=0;
  });
  window.addEventListener('popstate',()=>{
    const topic=new URLSearchParams(location.search).get('topic');
    if(topic)selectTopic(topic);
    else selected=null;
    render();
  });
  search.addEventListener('input',render);
  fetch('help.json').then(r=>r.json()).then(data=>{sections=normalize(data);sections.push(keybindSection());const q=new URLSearchParams(location.search);search.value=q.get('search')||'';const topic=q.get('topic');if(topic)selectTopic(topic);render();}).catch(e=>{main.textContent='Could not load help.json: '+e.message;});
})();
</script>
</body>
</html>
